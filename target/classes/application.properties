spring.application.name=ECPapi

# MySQL WAMP - Base ecpsymf (mirror du schema Symfony)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ecpsymf?useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Naming strategy - noms de colonnes exacts (snake_case)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Serveur
server.port=8080

# JWT
jwt.secret=ECPEmballeEstPeseSecretKey2026SuperLong256BitsMinimum!!
jwt.expiration=86400000

